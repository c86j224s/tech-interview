# Apache Pulsar 4.2.4 broker configuration. Internal names resolve on the Compose network;
# the external listener is loopback-only on the host.
clusterName=local-cluster
zookeeperServers=zookeeper:2181
configurationStoreServers=zookeeper:2181
metadataStoreUrl=zk:zookeeper:2181
configurationMetadataStoreUrl=zk:zookeeper:2181
brokerServicePort=
bindAddresses=internal:pulsar://0.0.0.0:6650,external:pulsar://0.0.0.0:16650
advertisedListeners=internal:pulsar://broker-1:6650,external:pulsar://127.0.0.1:6650
internalListenerName=internal
webServicePort=8080
managedLedgerDefaultEnsembleSize=3
managedLedgerDefaultWriteQuorum=3
managedLedgerDefaultAckQuorum=2
